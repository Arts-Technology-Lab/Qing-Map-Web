<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Qing Map — ATLab</title>
  </head>
  <body class="atlab-body">
    <div id="atlab" class="atlab" aria-label="ATLab wall and floor canvas">
      <!-- Wall: 3536 × 808 — full interactive experience -->
      <section id="atlab-wall" class="atlab-wall" aria-label="Wall display">
        <div id="app" class="intro-active">
          <div id="viewer" class="viewer" hidden></div>
          <img
            id="preview"
            class="preview"
            src="/map-preview.jpg"
            alt="Qing dynasty map (preview)"
            draggable="false"
          />

          <aside id="toolbar" class="toolbar" aria-label="Map controls">
            <button type="button" class="badge-btn" id="btn-zoom-in" title="近 — Zoom in" aria-label="近"></button>
            <button type="button" class="badge-btn" id="btn-zoom-out" title="遠 — Zoom out" aria-label="遠"></button>
            <button type="button" class="badge-btn" id="btn-home" title="全 — Fit map" aria-label="全"></button>
            <button
              type="button"
              class="badge-btn"
              id="btn-toggle-minimap"
              title="圖 — Show or hide minimap"
              aria-label="圖"
              aria-pressed="true"
            ></button>
            <button
              type="button"
              class="badge-btn"
              id="btn-focus"
              title="淨 — Focus mode"
              aria-label="淨"
              aria-pressed="false"
            ></button>
          </aside>

          <aside id="minimap-panel" class="minimap-panel" aria-label="Minimap">
            <div class="minimap-drag" title="Drag minimap" aria-hidden="true">
              <span class="minimap-edge edge-n"></span>
              <span class="minimap-edge edge-e"></span>
              <span class="minimap-edge edge-s"></span>
              <span class="minimap-edge edge-w"></span>
            </div>
            <button
              type="button"
              class="badge-btn minimap-hide"
              id="btn-hide-minimap"
              title="收 — Hide minimap"
              aria-label="收"
            ></button>
            <div class="minimap-paper">
              <div id="map-navigator" class="map-navigator"></div>
            </div>
          </aside>

          <p id="status" class="status">Loading preview…</p>
          <p id="tile-status" class="tile-status" hidden>Loading high-res tiles…</p>

          <div id="intro" class="intro" hidden>
            <div class="intro-clouds" aria-hidden="true">
              <div class="intro-mist-wash"></div>
              <div class="intro-veil-clouds" id="intro-veil-clouds"></div>
            </div>
            <button
              type="button"
              id="intro-seal"
              class="intro-seal"
              aria-label="Enter the map"
            >
              <img src="/intro/qing-seal.png" alt="" draggable="false" />
            </button>
          </div>
        </div>
      </section>

      <!-- Floor: 3536 × 2400 — full map only; #floor-overlays for future highlights -->
      <section id="atlab-floor" class="atlab-floor" aria-label="Floor display">
        <img
          id="floor-preview"
          class="floor-preview"
          src="/map-preview.jpg"
          alt=""
          draggable="false"
        />
        <div id="floor-viewer" class="floor-viewer"></div>
        <div id="floor-overlays" class="floor-overlays" aria-hidden="true"></div>
      </section>
    </div>
    <script type="module" src="/src/atlab/main.ts"></script>
  </body>
</html>
